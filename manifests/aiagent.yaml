apiVersion: ai.example.com/v1alpha1
kind: AIAgent
metadata:
  name: devops-agent
  namespace: default
spec:
  replicas: 1

  image: ai-agent:v1

  model:
    provider: openai
    name: gpt-4.1-mini

  agent:
    role: devops-engineer
    systemPrompt: "You are a Kubernetes DevOps assistant."
    capabilities:
      - kubernetes-discovery
      - log-analysis

  memory:
    enabled: false

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
